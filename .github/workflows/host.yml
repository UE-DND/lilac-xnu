name: Host source and build checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux host libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config libusb-1.0-0-dev
      - name: Install macOS host libraries
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config libusb
      - run: ./lilac sources check
      - run: ./lilac test host
      - run: ./lilac build xperable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-results-${{ matrix.os }}
          path: out/runs/
